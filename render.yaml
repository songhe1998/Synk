services:
  - type: web
    name: synk-demo
    runtime: node
    region: virginia
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_SCENE_MODEL
        value: gpt-5.4
      - key: OPENAI_IMAGE_ORCHESTRATOR_MODEL
        value: gpt-5.4
      - key: SESSION_DATA_ROOT
        value: /var/data/sessions
    disk:
      name: synk-data
      mountPath: /var/data
      sizeGB: 10
